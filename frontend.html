<!DOCTYPE html>
<html>

<head>
  <!-- Wikimedia Commons Favicon -->
  <link rel="icon" type="image/png"
    href="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Commons-logo.svg/128px-Commons-logo.svg.png">

  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Commons-logo.svg">

  <meta charset="utf-8">
  <title>Wikimedia Commons Filter</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: linear-gradient(135deg, #e3eeff, #f5f7ff);
      --text: #1c2942;
      --card: rgba(255, 255, 255, 0.72);
      --accent: #4a6bff;
    }

    body.dark {
      --bg: linear-gradient(135deg, #0b0f18, #151b28);
      --text: #e2e8ff;
      --card: rgba(28, 34, 48, 0.7);
      --accent: #6f8cff;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      padding: 40px 20px;
      transition: 0.3s;
    }

    /* Logo */
    .commons-logo {
      width: 95px;
      height: 95px;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.65));
      transition: 0.3s ease;
    }

    .commons-logo:hover {
      transform: scale(1.05);
    }

    /* Page Title & Theme Toggle */
    h1 {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
    }

    .toggle {
      text-align: center;
      cursor: pointer;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    /* Search Box */
    .search-card {
      max-width: 750px;
      margin: auto;
      padding: 22px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
    }

    .search-box {
      max-width: 420px;
      margin: auto;
      padding: 25px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    body.dark .search-box {
      background: rgba(25, 35, 50, 0.65);
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #cfd6e4;
    }

    button {
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    /* Results Grid */
    #results {
      margin-top: 35px;
      padding-bottom: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
      max-width: 1300px;
      margin-inline: auto;
    }

    .file-item {
      background: var(--card);
      padding: 15px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.15);
    }

    /* FIXED IMAGE SIZE */
    .file-item img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 14px;
    }

    .download-btn {
      display: block;
      margin-top: 12px;
      padding: 10px;
      background: #3477ff;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }

    /* Autocomplete Dropdown */
    .autocomplete-box {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      z-index: 2000;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-item {
      padding: 10px;
      cursor: pointer;
    }

    .autocomplete-item:hover {
      background: #e8f0ff;
    }

    body.dark .autocomplete-box {
      background: #1c2435;
      border-color: #2d3b4d;
      color: white;
    }

    body.dark .autocomplete-item:hover {
      background: #2d3b4d;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div style="text-align:center;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Commons-logo.svg" class="commons-logo">
  </div>

  <div class="toggle" onclick="toggleDarkMode()">🌙 Dark Mode</div>

  <h1>Wiki Fetch</h1>

  <div class="search-card">
    <div class="search-box">

      <input type="text" id="usernameInput" placeholder="Enter username…">
      <input type="text" id="categoryInput" placeholder="Enter category…">

      <button id="filterBtn">Search</button>

    </div>
  </div>

  <div id="results"></div>

  <footer>
    <p>© 2025 Wikimedia Commons File Filter Tool</p>
    <p>Developed by Binto, Ardra, Amal, Alphonsa • Powered by Wikimedia Commons API</p>
  </footer>

  <script>
    /* ==========================
       DARK MODE
    =========================== */
    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    /* ==========================
       FETCH USER UPLOADED FILES
    =========================== */
    async function fetchUserFiles(username) {
      const url =
        `https://commons.wikimedia.org/w/api.php?action=query&format=json&list=allimages&formatversion=2&aisort=timestamp&aidir=descending&aiuser=${encodeURIComponent(username)}&ailimit=500&origin=*`;

      const resp = await fetch(url);
      const data = await resp.json();
      return (data.query?.allimages || []).map(img => ({ name: img.title || img.name }));
    }

    async function fetchFileCategories(filename) {
      const fileTitle = filename.startsWith("File:") ? filename : `File:${filename}`;
      const url =
        `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitle)}&prop=categories&format=json&formatversion=2&origin=*`;

      const resp = await fetch(url);
      const data = await resp.json();

      if (!data.query?.pages) return [];
      return data.query.pages[0].categories?.map(c => c.title.replace("Category:", "")) || [];
    }

    function getFileThumbnail(filename) {
      return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(filename)}`;
    }

    /* ==========================
       AUTOCOMPLETE SYSTEM
    =========================== */
    function setupAutocomplete(inputElement, fetchFunction) {
      const dropdown = document.createElement("div");
      dropdown.className = "autocomplete-box";
      document.body.appendChild(dropdown);

      inputElement.addEventListener("input", async () => {
        const query = inputElement.value.trim();
        if (query.length < 2) {
          dropdown.style.display = "none";
          return;
        }

        const suggestions = await fetchFunction(query);
        dropdown.innerHTML = "";

        suggestions.forEach(s => {
          const div = document.createElement("div");
          div.className = "autocomplete-item";
          div.textContent = s;
          div.onclick = () => {
            inputElement.value = s;
            dropdown.style.display = "none";
          };
          dropdown.appendChild(div);
        });

        const rect = inputElement.getBoundingClientRect();
        dropdown.style.left = rect.left + "px";
        dropdown.style.top = rect.bottom + window.scrollY + "px";
        dropdown.style.width = rect.width + "px";
        dropdown.style.display = "block";
      });

      document.addEventListener("click", (e) => {
        if (e.target !== inputElement) dropdown.style.display = "none";
      });
    }

    async function fetchUserSuggestions(query) {
      const url =
        `https://commons.wikimedia.org/w/api.php?action=query&list=allusers&auprefix=${encodeURIComponent(query)}&aulimit=20&format=json&origin=*`;

      const resp = await fetch(url);
      const data = await resp.json();
      return data.query?.allusers?.map(u => u.name) || [];
    }

    async function fetchCategorySuggestions(query) {
      const url =
        `https://commons.wikimedia.org/w/api.php?action=query&list=allcategories&acprefix=${encodeURIComponent(query)}&aclimit=20&format=json&origin=*`;

      const resp = await fetch(url);
      const data = await resp.json();

      /* FIXED FIELD: c["*"] */
      return data.query?.allcategories?.map(c => c["*"]) || [];
    }

    setupAutocomplete(document.getElementById("usernameInput"), fetchUserSuggestions);
    setupAutocomplete(document.getElementById("categoryInput"), fetchCategorySuggestions);

    /* ==========================
       SEARCH BUTTON
    =========================== */
    document.getElementById("filterBtn").addEventListener("click", async () => {
      const username = document.getElementById("usernameInput").value.trim();
      const category = document.getElementById("categoryInput").value.trim().toLowerCase();
      const resultsDiv = document.getElementById("results");

      resultsDiv.innerHTML = "Loading...";

      const files = await fetchUserFiles(username);
      if (!files.length) return resultsDiv.innerHTML = "No files uploaded by this user.";

      const filesWithCats = await Promise.all(
        files.map(async f => ({
          name: f.name,
          categories: await fetchFileCategories(f.name),
          url: getFileThumbnail(f.name)
        }))
      );

      const filtered = filesWithCats.filter(f =>
        f.categories.some(c => c.toLowerCase().includes(category))
      );

      if (!filtered.length) return resultsDiv.innerHTML = "No matching files found.";

      resultsDiv.innerHTML = "";
      filtered.forEach(f => {
        const card = document.createElement("div");
        card.className = "file-item";
        card.innerHTML = `
          <img src="${f.url}">
          <strong>${f.name}</strong>
          <p>Categories: ${f.categories.join(", ")}</p>
          <a href="${f.url}" target="_blank" class="download-btn">👁️ View</a>
        `;
        resultsDiv.appendChild(card);
      });
    });
  </script>

</body>

</html>
