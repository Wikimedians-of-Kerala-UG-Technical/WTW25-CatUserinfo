<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wikimedia File Viewer (No PHP)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ===== THEME ===== */
        :root {
            --bg: #eef3ff;
            --box: #ffffff;
            --text: #022a62;
            --input-bg: #ffffff;
            --input-border: #aac1e6;
            --button: #0a53ff;
            --button-hover: #003fcb;
        }

        body.dark {
            --bg: #0d1117;
            --box: #161b22;
            --text: #d1e1ff;
            --input-bg: #0d1117;
            --input-border: #3d4b63;
            --button: #1f6bff;
            --button-hover: #0450d4;
        }

        body {
            background: var(--bg);
            margin: 0;
            font-family: Arial, sans-serif;
            transition: background .3s ease;
        }

        /* ===== UI BOX ===== */
        .center-box {
            background: var(--box);
            width: 450px;
            max-width: 95%;
            margin: 40px auto 20px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: var(--text);
            margin-top: 0;
        }

        label {
            display: block;
            color: var(--text);
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            margin-top: 5px;
            outline: none;
            box-sizing: border-box;
        }

        /* ===== AUTOCOMPLETE ===== */
        .autocomplete-list {
            position: absolute;
            background: var(--box);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            width: calc(100% - 60px);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }

        .autocomplete-item {
            padding: 10px;
            color: var(--text);
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background: var(--input-border);
        }

        /* ===== BUTTONS ===== */
        button {
            width: 100%;
            padding: 12px;
            background: var(--button);
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
        }

        button:hover {
            background: var(--button-hover);
            transform: scale(1.02);
        }

        /* ===== DARK MODE ===== */
        .toggle {
            text-align: center;
            color: var(--text);
            cursor: pointer;
            margin-bottom: 15px;
        }

        body.dark .toggle {
            color: #d4e0ff;
        }

        /* ===== LOADER ===== */
        #loader {
            text-align: center;
            color: var(--text);
            margin-top: 10px;
            display: none;
        }

        /* ===== GALLERY ===== */
        .gallery {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            padding: 0 10px;
        }

        .card {
            background: var(--box);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card-title {
            color: var(--text);
            font-size: 14px;
            height: 50px;
            overflow: hidden;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="center-box">

        <div class="toggle" onclick="toggleDark()">🌙 Dark Mode</div>

        <h2>Wikimedia Commons File Viewer</h2>

        <label>Username</label>
        <input id="username" autocomplete="off">
        <div id="user-suggest" class="autocomplete-list"></div>

        <label>Category</label>
        <input id="category" autocomplete="off">
        <div id="cat-suggest" class="autocomplete-list"></div>

        <button onclick="searchFiles()">Search</button>

        <div id="loader">⏳ Loading...</div>
    </div>

    <div id="gallery" class="gallery"></div>

    <script>
        /* ===== DARK MODE ===== */
        function toggleDark() {
            document.body.classList.toggle("dark");
        }

        /* ===== AUTOCOMPLETE SYSTEM (Min 3 characters) ===== */
        function debounce(func, delay) {
            let timer;
            return function () {
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(this, arguments), delay);
            };
        }

        /* ===== Username autocomplete ===== */
        document.getElementById("username").addEventListener("input", debounce(async function () {
            let q = this.value.trim();
            let list = document.getElementById("user-suggest");

            list.innerHTML = "";
            if (q.length < 3) return; // MIN 3 CHAR REQUIRED

            let url = `https://commons.wikimedia.org/w/api.php?action=query&list=allusers&auprefix=${encodeURIComponent(q)}&aulimit=10&format=json&origin=*`;

            let res = await fetch(url);
            let data = await res.json();

            (data.query.allusers || []).forEach(u => {
                let item = document.createElement("div");
                item.className = "autocomplete-item";
                item.textContent = u.name;
                item.onclick = () => {
                    document.getElementById("username").value = u.name;
                    list.innerHTML = "";
                };
                list.appendChild(item);
            });
        }, 400));

        /* ===== Category autocomplete ===== */
        document.getElementById("category").addEventListener("input", debounce(async function () {
            let q = this.value.trim();
            let list = document.getElementById("cat-suggest");

            list.innerHTML = "";
            if (q.length < 3) return; // MIN 3 CHARACTERS REQUIRED

            let url = `https://commons.wikimedia.org/w/api.php?action=query&list=allcategories&acprefix=${encodeURIComponent(q)}&aclimit=10&format=json&origin=*`;

            let res = await fetch(url);
            let data = await res.json();

            (data.query.allcategories || []).forEach(c => {
                let item = document.createElement("div");
                item.className = "autocomplete-item";
                item.textContent = c["*"];
                item.onclick = () => {
                    document.getElementById("category").value = c["*"];
                    list.innerHTML = "";
                };
                list.appendChild(item);
            });
        }, 400));

        /* ===== MAIN SEARCH (Exact match filtering) ===== */
        async function searchFiles() {
            const username = document.getElementById("username").value.trim();
            let category = document.getElementById("category").value.trim();
            const loader = document.getElementById("loader");
            const gallery = document.getElementById("gallery");

            gallery.innerHTML = "";
            if (!username || !category) return alert("Enter both username and category.");

            if (!category.toLowerCase().startsWith("category:"))
                category = "Category:" + category;

            loader.style.display = "block";

            // 1️⃣ GET ALL FILES UPLOADED BY USER
            const uploadsUrl =
                `https://commons.wikimedia.org/w/api.php?action=query&list=allimages&aiuser=${encodeURIComponent(username)}&aisort=timestamp&aidir=descending&ailimit=50&format=json&origin=*`;

            const uploadsData = await fetchJSON(uploadsUrl);
            const uploadedFiles = uploadsData.query.allimages || [];

            const matchedFiles = [];

            // 2️⃣ CHECK CATEGORY FOR EACH
            for (const img of uploadedFiles) {
                const fileTitle = img.title;

                const catUrl =
                    `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitle)}&prop=categories&format=json&formatversion=2&origin=*`;

                const catData = await fetchJSON(catUrl);
                const cats = catData.query.pages[0].categories || [];

                if (cats.some(c => c.title.toLowerCase() === category.toLowerCase())) {
                    matchedFiles.push(img);
                }
            }

            loader.style.display = "none";

            if (matchedFiles.length === 0) {
                gallery.innerHTML = `<h3 style="text-align:center;color:red;">No matching files.</h3>`;
                return;
            }

            matchedFiles.forEach(img => {
                const fileName = img.title.replace("File:", "");
                const thumb = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fileName)}?width=400`;

                gallery.innerHTML += `
        <div class="card">
            <img src="${thumb}">
            <div class="card-title">${img.title}</div>
            <a href="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fileName)}" target="_blank">
                <button>Download</button>
            </a>
        </div>`;
            });
        }

        /* Fetch helper */
        async function fetchJSON(url) {
            const res = await fetch(url);
            return await res.json();
        }
    </script>

</body>

</html>
